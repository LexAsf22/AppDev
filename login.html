<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LabClass Login</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <h1>LabClass</h1>
    <div class="user-info">Welcome!</div>
</header>

<div class="container" style="justify-content:center; align-items:center; min-height:70vh;">
    <div class="card" style="max-width:400px; width:100%; text-align:center;">
        <h2 style="margin-bottom:20px;">Login</h2>
        <form id="loginForm">
            <label for="username">Username / Email</label>
            <input type="text" id="username" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <label for="role">Login As</label>
            <select id="role">
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="staff">Staff</option>
                <option value="admin">Admin</option>
            </select>

            <button type="button" onclick="login()" style="margin-top:10px;">Login</button>
        </form>
    </div>
</div>

<script>
    function login() {
        const role = document.getElementById('role').value;
        if(role === 'student') window.location.href = 'student_dashboard.html';
        else if(role === 'teacher') window.location.href = 'teacher_dashboard.html';
        else if(role === 'staff') window.location.href = 'staff_dashboard.html';
        else if(role === 'admin') window.location.href = 'admin_dashboard.html';
    }
</script>
</body>
</html>
